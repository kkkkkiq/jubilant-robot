<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <title>:D</title>
    <style>
        body{
            background-image: url(praia.jfif);
            display: block;
            background-repeat: no-repeat;
            background-size: cover;

        }

        .telasop{
            display: none;
        }

        .fundo {
            background-color: rgba(50, 112, 123, 0.8);
            width: 600px;
            height: 600px;
            border-radius: 20%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .botoes {
    display: inline-block;
    
    background: linear-gradient(135deg, #ff4d6d, #c9184a);
    color: white;

    padding: 13px 28px;
    border: none;
    border-radius: 30px;

    font-size: 16px;
    font-weight: bold;
    text-decoration: none;

    cursor: pointer;

    box-shadow: 0 6px 15px rgba(201, 24, 74, 0.3);

    transition: all 0.3s ease;
}

.botoes:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(201, 24, 74, 0.5);
}

.botoes:active {
    transform: scale(0.97);
}

.espaço{
    margin-top: 15px;
}

.texto{
    font-family: 'Dancing Script', cursive;
    font-size: 50px;
    color: aliceblue;
}

    </style>
</head>
<body>
    <main>

    </main>
        <section>
            <div class="container telasop justify-content-center align-items-center vh-100" id="per">
                <div class="row">
                    <div class="col-md-12 fundo text-center">
                        <div>
                        <h1 class="texto">Quer sair comigo?</h1>
                        <button class="botoes" id="nao" onclick="sumir()">Não</button>
                        <button class="botoes" id="sim" onclick="mostrarTela('dia')">Sim</button>
                        </div>

                        <div>
                            <img src="sim.jfif" alt="sim" width="250px" height="250px" class="espaço">
                        </div>
                    </div>

                </div>

            </div>
            

        </section>

        <section>
            <div class="container telasop justify-content-center align-items-center vh-100" id="dia">
                <div class="row">
                    <div class="col-md-12 fundo text-center">
                        <div>
                        <h2 class="texto">Qual dia?</h2>
                        <form id="formulario">
                            <label for="data"></label>
                            <input type="datetime-local" id="data" name="data" required>
                            <button type="submit" class="botoes espaço">Marcar</button>
                        </form>

                        <p id="resultado"></p>

                        </div>
                        <div>
                        <img src="oba.jfif" alt="oba" width="250px" height="250px" class="espaço">
                        </div>

                    </div>

                </div>

            </div>
        </section>

        <section>
            <div  class="container telasop justify-content-center align-items-center vh-100" id="eba">
                <div class="row">
                    <div class="col-md-12 fundo text-center">
                        <div>
                        <h2 class="texto">Eba</h2>
                        </div>
                        <div>
                        <img src="show.jfif" alt="show" width="250px" height="250px"class="espaço" >
                        </div>
                    </div>

                </div>

            </div>

        </section>

        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

        <script>
// Inicializa o EmailJS
emailjs.init({
    publicKey: "7wna_9QrWQCnjnqkl"
});


// Troca de telas
function mostrarTela(id) {

    const telas = document.querySelectorAll(".telasop");

    telas.forEach(function(tela) {
        tela.style.display = "none";
    });

    document.getElementById(id).style.display = "flex";
}


// Primeira tela
window.onload = function() {
    mostrarTela("per");
};


// Botão NÃO
function sumir() {

    document.getElementById("nao").style.display = "none";

}


// Formulário
document.getElementById("formulario").addEventListener("submit", function(event) {

    event.preventDefault();

    const resultado = document.getElementById("resultado");

    resultado.textContent = "Enviando...";


    emailjs.sendForm(
        "service_je8kxja",
        "template_fga22in",
        this
    )

    .then(function() {

        resultado.textContent = "Marcado com sucesso! ❤️";

        document.getElementById("formulario").reset();

        // Depois de enviar, vai para a tela Eba
        mostrarTela("eba");

    })

    .catch(function(error) {

        console.log(error);

        resultado.textContent =
            "Erro ao enviar. Tente novamente.";

    });

});

        </script>
</body>
</html>
